# La suite non tocca la rete: i parser girano sulle fixture salvate in
# `tests/fixtures/` e il motore su dati sintetici.
#
# I due dataset geografici (29 MB) non stanno nel repository e qui non vengono
# scaricati: scaricarli a ogni giro renderebbe l'esito di questa verifica
# dipendente da due siti di terzi. Gli otto test che ne hanno bisogno si saltano
# dichiarandolo (vedi `tests/_datasets.py`), e ne restano 86 che girano davvero.
# Misurato su un clone senza `data/`: 86 passed, 8 skipped.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the offline suite
        run: pytest tests -q
