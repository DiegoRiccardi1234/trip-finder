# La suite non tocca la rete: i parser girano sulle fixture salvate in
# `tests/fixtures/` e il motore su dati sintetici. I due dataset geografici da
# 29 MB non stanno nel repository, quindi i test che li richiedono si saltano da
# soli (`tests/test_geo.py`) invece di fallire.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run the offline suite
        run: pytest tests -q
