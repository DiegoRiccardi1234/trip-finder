# La suite non tocca la rete: i parser girano sulle fixture salvate in
# `tests/fixtures/` e il motore su dati sintetici.
#
# I tre dataset geografici (37 MB) non stanno nel repository e qui non vengono
# scaricati: scaricarli a ogni giro renderebbe l'esito di questa verifica
# dipendente da siti di terzi. I test che ne hanno bisogno si saltano
# dichiarandolo (vedi `tests/_datasets.py`), e gli altri girano davvero.
# Misurato su un clone senza `data/`, col browser installato: 192 passed,
# 27 skipped. Gli skip sono tutti e soli i test che vogliono i dataset — da
# quando c'e' anche il gazetteer mondiale sono le citta' del mondo, gli esonimi,
# i fusi orari e gli hub.
#
# Chi aggiunge test che alzano l'applicazione (`TestClient`) non usi il context
# manager: quello esegue l'avvio, che costruisce l'indice geografico e senza i
# dataset non fallisce con uno skip — fallisce e basta, ma solo qui, non sul
# portatile di chi li ha scaricati.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # I test della pagina guidano un browser vero. Senza questo passo si
      # saltano da soli, dichiarandolo: e' il comportamento giusto sul portatile
      # di chi clona, ma qui la pagina va provata davvero.
      - name: Install Chromium
        run: patchright install --with-deps chromium

      - name: Run the offline suite
        run: pytest tests -q
