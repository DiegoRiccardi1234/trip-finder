name: release

# Il bundle si costruisce su Windows perche' e' per Windows: PyInstaller non
# fa cross-compilazione, e l'icona nell'area di notifica e' Win32.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Costruisci il bundle
        # `build_exe.py` scarica da solo i due cataloghi delle fermate se non ci
        # sono: in un checkout pulito `data/` non esiste, ed e' la parte che
        # deve finire dentro lo zip.
        run: python scripts/build_exe.py

      - name: Estrai le note dal CHANGELOG
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag -replace '^v',''
          $content = Get-Content CHANGELOG.md -Raw
          $escaped = [regex]::Escape($version)
          $pattern = "(?ms)^## \[$escaped\][^\r\n]*\r?\n(.*?)(?=\r?\n## \[|\z)"
          $match = [regex]::Match($content, $pattern)
          if ($match.Success) {
            $section = $match.Groups[1].Value.Trim()
          } else {
            $section = "Release $tag"
          }
          $section | Out-File -FilePath release-notes.md -Encoding utf8

      - name: Allega alla release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TripFinder-windows.zip
          body_path: release-notes.md
          fail_on_unmatched_files: true

      - name: Conserva l'archivio (esecuzione a mano)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: TripFinder-windows
          path: dist/TripFinder-windows.zip
          retention-days: 14
